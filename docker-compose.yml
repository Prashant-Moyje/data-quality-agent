services:
  ollama:
    image: ollama/ollama:latest
    container_name: dqa-ollama
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    restart: unless-stopped

  api:
    build: .
    container_name: dqa-api
    command: uvicorn data_quality_agent.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
      LOG_JSON: "true"
    depends_on: [ollama]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 256
    volumes: [reports:/app/runs]
    restart: unless-stopped

  ui:
    build: .
    container_name: dqa-ui
    command: streamlit run /usr/local/lib/python3.12/site-packages/data_quality_agent/ui.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]
    mem_limit: 1g
    restart: unless-stopped

volumes:
  ollama_models:
  reports:
