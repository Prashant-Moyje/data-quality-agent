[project]
name = "data-quality-agent"
version = "0.1.0"
description = "An autonomous agent that audits datasets for quality problems."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3",              # local models — default backend, no key, no cost
    "pandas>=2.2",              # the analysis engine the agent drives
    "pyarrow>=15.0",            # parquet support for pandas
    "openpyxl>=3.1",            # xlsx support for pandas
    "pydantic>=2.7",            # validates every tool call the model makes
    "pydantic-settings>=2.3",   # fail-fast config from .env
    "fastapi>=0.111",           # backend API
    "uvicorn[standard]>=0.30",  # ASGI server
    "python-multipart>=0.0.9",  # required by FastAPI for file uploads
    "streamlit>=1.36",          # demo UI
    "requests>=2.32",           # UI -> API client
    "structlog>=24.1",          # structured logs keyed by run_id
]

[project.optional-dependencies]
# The hosted backend is opt-in: llm.py imports the SDK lazily, so a local-only
# install has no reason to carry it.  pip install "data-quality-agent[anthropic]"
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
data-quality-agent = "data_quality_agent.cli:main"
dqa = "data_quality_agent.cli:main"   # same command, for typing

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
